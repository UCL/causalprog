<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="550" viewBox="0 0 1400 550" role="img" aria-labelledby="title description">
  <title id="title">LayerNorm and ReLU MLP with layer dimensions 3-6-4-2</title>
  <desc id="description">A fully connected MLP with 3 inputs, hidden-layer dimensions [6, 4], and 2 outputs. Each hidden layer applies a linear transformation, LayerNorm, and ReLU. The output layer is linear.</desc>
  <style>
    .background { fill: #ffffff; }
    .hidden-container { fill: #ec4899; fill-opacity: 0.045; stroke: #db2777; stroke-opacity: 0.48; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { stroke: #64748b; stroke-width: 1.2; opacity: 0.29; }
    .operation-edge { stroke: #64748b; stroke-width: 1.35; opacity: 0.68; }
    .node { stroke-width: 2; }
    .input-node { fill: #dbeafe; stroke: #2563eb; }
    .linear-node { fill: #f1f5f9; stroke: #64748b; }
    .activation-node { fill: #ede9fe; stroke: #7c3aed; }
    .activation-glyph { fill: none; stroke: #7c3aed; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .output-node { fill: #dcfce7; stroke: #16a34a; }
    .norm-band { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .node-label { fill: #111827; font: 500 9px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .layer-title { fill: #111827; font: 500 15px sans-serif; text-anchor: middle; }
    .container-title { fill: #9d174d; font: 500 15px sans-serif; text-anchor: middle; }
    .container-detail { fill: #be185d; font: 400 11px sans-serif; text-anchor: middle; }
    .band-label { fill: #92400e; font: 500 12px sans-serif; text-anchor: middle; dominant-baseline: central; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .hidden-container { fill: #f472b6; fill-opacity: 0.06; stroke: #f472b6; stroke-opacity: 0.55; }
      .edge, .operation-edge { stroke: #94a3b8; }
      .input-node { fill: #172554; stroke: #60a5fa; }
      .linear-node { fill: #1e293b; stroke: #94a3b8; }
      .activation-node { fill: #2e1065; stroke: #a78bfa; }
      .activation-glyph { stroke: #c4b5fd; }
      .output-node { fill: #052e16; stroke: #4ade80; }
      .norm-band { fill: #422006; stroke: #f59e0b; }
      .node-label, .layer-title { fill: #f8fafc; }
      .container-title { fill: #fbcfe8; }
      .container-detail { fill: #f9a8d4; }
      .band-label { fill: #fde68a; }
    }
  </style>
