<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title description">
  <title id="title">Fully connected MLP with layer dimensions 3-6-4-2</title>
  <desc id="description">A fully connected MLP with 3 inputs, hidden layer 1 has 6 units, hidden layer 2 has 4 units, and 2 outputs. The hidden layers contain only linear outputs because normalisation is disabled and the activation is identity.</desc>
  <style>
    .background { fill: #ffffff; }
    .hidden-container { fill: #ec4899; fill-opacity: 0.045; stroke: #db2777; stroke-opacity: 0.48; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { stroke: #64748b; stroke-width: 1.2; opacity: 0.29; }
    .node { stroke-width: 2; }
    .input-node { fill: #dbeafe; stroke: #2563eb; }
    .linear-node { fill: #f1f5f9; stroke: #64748b; }
    .output-node { fill: #dcfce7; stroke: #16a34a; }
    .node-label { fill: #111827; font: 500 9px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .layer-title { fill: #111827; font: 500 15px sans-serif; text-anchor: middle; }
    .container-title { fill: #9d174d; font: 500 15px sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .hidden-container { fill: #f472b6; fill-opacity: 0.06; stroke: #f472b6; stroke-opacity: 0.55; }
      .edge { stroke: #94a3b8; }
      .input-node { fill: #172554; stroke: #60a5fa; }
      .linear-node { fill: #1e293b; stroke: #94a3b8; }
      .output-node { fill: #052e16; stroke: #4ade80; }
      .node-label, .layer-title { fill: #f8fafc; }
      .container-title { fill: #fbcfe8; }
    }
  </style>
  <rect class="background" width="1120" height="550" />
  <rect class="hidden-container" x="300.0" y="82.0" width="190.0" height="435.0" rx="24" />
  <text class="container-title" x="395.0" y="106">Hidden layer 1</text>
  <text class="layer-title" x="395.0" y="151">Linear outputs</text>
  <rect class="hidden-container" x="630.0" y="82.0" width="190.0" height="435.0" rx="24" />
  <text class="container-title" x="725.0" y="106">Hidden layer 2</text>
  <text class="layer-title" x="725.0" y="151">Linear outputs</text>
